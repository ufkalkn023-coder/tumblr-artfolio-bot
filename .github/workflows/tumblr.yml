name: Tumblr Curation Bot

on:
  schedule:
    # Her saat başı çalış (Günde 24 paylaşım)
    - cron: '0 * * * *'
  workflow_dispatch: # Manuel tetiklemeye izin ver

concurrency:
  group: tumblr-publish
  cancel-in-progress: false

jobs:
  curate-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write # posted_ids.json dosyasını repoya commit & push edebilmek için

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kürasyon Botunu Çalıştır
        env:
          TZ: Europe/Istanbul
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          TUMBLR_OAUTH_SECRET: ${{ secrets.TUMBLR_OAUTH_SECRET }}
          TUMBLR_BLOG_NAME: ${{ secrets.TUMBLR_BLOG_NAME }}
        run: |
          python main.py

      - name: Scoring Telemetry Artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scoring-telemetry
          path: output/telemetry/scoring-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: State Güncelle (posted_ids.json Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain posted_ids.json)" ]; then
            git add posted_ids.json
            git commit -m "Auto: Update posted_ids.json [skip ci]"

            max_attempts=3
            for attempt in $(seq 1 "$max_attempts"); do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "posted_ids.json başarıyla repoya güncellendi."
                exit 0
              fi

              if [ "$attempt" -lt "$max_attempts" ]; then
                delay=$((attempt * 2))
                echo "State push denemesi $attempt/$max_attempts başarısız; ${delay}s sonra tekrar denenecek."
                sleep "$delay"
              fi
            done

            echo "posted_ids.json $max_attempts denemede repoya gönderilemedi."
            exit 1
          else
            echo "posted_ids.json dosyasında değişiklik yok."
          fi
