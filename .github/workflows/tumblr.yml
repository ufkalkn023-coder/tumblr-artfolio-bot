name: Tumblr Curation Bot

on:
  schedule:
    # Her saat başı çalış (Günde 24 paylaşım)
    - cron: '0 * * * *'
  workflow_dispatch: # Manuel tetiklemeye izin ver

concurrency:
  group: tumblr-publish
  cancel-in-progress: false

jobs:
  curate-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write # posted_ids.json dosyasını repoya commit & push edebilmek için

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Re-run / stale checkout koruması: bot çalışmadan ÖNCE main üzerindeki en
      # güncel state (publication_state.json + posted_ids.json) çekilir. Aksi halde
      # "Re-run failed jobs" orijinal SHA'ya karşı çalışır ve önceki çalışmanın
      # commit'lediği rezervasyon/published kayıtlarını görmez (double-post riski).
      - name: State'i Tazele (checkout sonrası pull --rebase)
        run: |
          git pull --rebase origin main

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: Bağımlılıkları Yükle (kilitlenmiş çalışma zamanı grafiği)
        run: |
          python -m pip install -r requirements.lock

      - name: Kürasyon Botunu Çalıştır
        env:
          TZ: Europe/Istanbul
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          TUMBLR_OAUTH_SECRET: ${{ secrets.TUMBLR_OAUTH_SECRET }}
          TUMBLR_BLOG_NAME: ${{ secrets.TUMBLR_BLOG_NAME }}
        run: |
          python main.py

      - name: Scoring Telemetry Artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scoring-telemetry
          path: output/telemetry/scoring-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: State Güncelle (publication state Commit & Push)
        if: always() # Rezervasyon kaydedilmiş ama yayın yarıda kalmışsa bile state commit'lensin
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          state_files="posted_ids.json publication_state.json"

          if [ -n "$(git status --porcelain -- $state_files)" ]; then
            # Yalnızca state dosyaları stage'lenir; .env / telemetry / .mimosa / geçici
            # dosyalar asla commit'e dahil edilmez.
            git add $state_files
            git commit -m "Auto: Update publication state [skip ci]"

            max_attempts=3
            for attempt in $(seq 1 "$max_attempts"); do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "publication state başarıyla repoya güncellendi."
                exit 0
              fi

              # Rebase çakışması yarım bırakılırsa sonraki denemeler de kaçınlıyla
              # başarısız olur ("rebase in progress"); denemeler arası temizlik şart.
              if [ -d "$(git rev-parse --git-path rebase-merge 2>/dev/null)" ] || \
                 [ -d "$(git rev-parse --git-path rebase-apply 2>/dev/null)" ]; then
                git rebase --abort || true
              fi

              if [ "$attempt" -lt "$max_attempts" ]; then
                delay=$((attempt * 2))
                echo "State push denemesi $attempt/$max_attempts başarısız; ${delay}s sonra tekrar denenecek."
                sleep "$delay"
              fi
            done

            echo "publication state $max_attempts denemede repoya gönderilemedi."
            exit 1
          else
            echo "State dosyalarında (posted_ids.json, publication_state.json) değişiklik yok."
          fi
